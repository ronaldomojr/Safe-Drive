<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mapa de ocorrências | Safe Drive</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <script src="vendor/leaflet/leaflet.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="header.css"><link rel="stylesheet" href="mapa.css">
</head>
<body>

    <div id="map"></div>

    <div id="contaMapa"></div>
    <aside class="map-panel search-card">

      <details id="planejador"><summary class="search-box"><i class="fas fa-search" aria-hidden="true"></i> Para onde você está indo?</summary>
        <div class="trajeto">
          <label for="origem">Partida</label><div class="campo-rota"><input id="origem" placeholder="Rua, bairro ou lugar"><button id="buscarOrigem">Buscar</button></div>
          <div id="resOrigem"></div><div class="opcoes"><button id="marcarOrigem">Marcar partida</button></div>

          <button hidden id="usarGps">Usar ponto azul como partida</button>
          <label for="destino">Destino</label><div class="campo-rota"><input id="destino" placeholder="Para onde você vai?"><button id="buscarDestino">Buscar</button></div>
          <div id="resDestino"></div><button id="marcarDestino">Marcar destino no mapa</button>
          <button id="calcular">Traçar rota</button>
          <p id="rotaAviso" role="status"></p><section id="viagem" hidden><strong id="estimativa"></strong>
            <details><summary>Instruções do trajeto</summary><ol id="manobras"></ol></details>
            <label id="vozOpcao" hidden><input id="vozRota" type="checkbox"> Ouvir instruções</label>
            <button id="navegar">Iniciar navegação</button><button id="encerrar">Limpar rota</button></section>
        </div></details>
      <div class="recentes"><div class="recent-title">Locais recentes</div>
        <button class="recent-item" onclick="abrirPopupEndereco('Casa')"><span class="recent-item-left"><i class="fas fa-home"></i><span>Casa<small class="subtitle">Defina uma vez e pronto</small></span></span> ›</button>
        <button class="recent-item" onclick="abrirPopupEndereco('Trabalho')"><span class="recent-item-left"><i class="fas fa-briefcase"></i><span>Trabalho<small class="subtitle">Defina uma vez e pronto</small></span></span> ›</button>
      </div>
      <button id="gpsMapa" aria-pressed="false">◎ Minha localização</button><p id="posicaoMapa" role="status"></p>
      <nav><a href="central.html">Comunidade</a><a href="react.html">＋ Novo post</a></nav>
    </aside>
    <section class="floating-posts-container" aria-label="Postagens da comunidade">
      <div id="listaMapa"></div><p id="avisoMapa" role="status">Carregando postagens…</p><button id="atualizar" hidden>Tentar novamente</button>
    </section>
    <script src="header.js"></script><script src="localizacao.js"></script><script src="comunidade.js"></script><script src="script.js"></script><script src="enderecos.js"></script><script src="rotas.js"></script><script src="gps-mapa.js"></script><script src="mapa-posts.js"></script>
</body></html>
