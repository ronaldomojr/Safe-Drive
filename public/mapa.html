<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mapa de ocorrências | Safe Drive</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <script src="vendor/leaflet/leaflet.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="header.css"><link rel="stylesheet" href="mapa.css">
</head>
<body>

    <div id="map"></div>

    <div id="contaMapa"></div>
    <aside class="map-panel search-card" aria-label="Navegação do Safe Drive">
      <a class="marca-mapa" href="p_safedrive.html"><img src="Imagens/image-removebg-preview (1).png" alt="">Safe Drive</a>

      <details id="planejador"><summary class="search-box"><img alt="" class="icon-left" src="https://cdn-icons-png.flaticon.com/512/54/54481.png"><span id="textoBuscaRota">Para onde você está indo?</span><img alt="" class="icon-right" src="https://cdn-icons-png.flaticon.com/512/709/709631.png"></summary>
        <div class="trajeto">
          <div class="rotulo-rota"><label for="origem">Partida</label><button id="marcarOrigem">Marcar no mapa</button></div><div class="campo-rota"><input id="origem" placeholder="Rua, bairro ou lugar"><button id="buscarOrigem">Buscar</button></div>
          <div id="resOrigem"></div>

          <button hidden id="usarGps">Usar ponto azul como partida</button>
          <div class="rotulo-rota"><label for="destino">Destino</label><button id="marcarDestino">Marcar no mapa</button></div><div class="campo-rota"><input id="destino" placeholder="Para onde você vai?"><button id="buscarDestino">Buscar</button></div>
          <div id="resDestino"></div>
          <button id="calcular">Traçar rota</button>
          <p id="rotaAviso" role="status"></p><section id="viagem" hidden><strong id="estimativa"></strong>
            <details><summary>Instruções do trajeto</summary><ol id="manobras"></ol></details>
            <label id="vozOpcao" hidden><input id="vozRota" type="checkbox"> Ouvir instruções</label>
            <div class="acoes-viagem"><button id="navegar">Iniciar navegação</button><button id="encerrar">Limpar rota</button></div></section>
        </div></details>
      <div class="recentes"><div class="recent-title">Locais recentes</div>
        <button class="recent-item" onclick="abrirPopupEndereco('Casa')"><span class="recent-item-left"><img alt="" class="" src="https://cdn-icons-png.flaticon.com/512/1946/1946433.png"><span>Casa<small class="subtitle">Defina uma vez e pronto</small></span></span><img alt="" class="seta-recente" src="https://cdn-icons-png.flaticon.com/512/271/271228.png"></button>
        <button class="recent-item" onclick="abrirPopupEndereco('Trabalho')"><span class="recent-item-left"><img alt="" class="" src="https://cdn-icons-png.flaticon.com/512/3103/3103446.png"><span>Trabalho<small class="subtitle">Defina uma vez e pronto</small></span></span><img alt="" class="seta-recente" src="https://cdn-icons-png.flaticon.com/512/271/271228.png"></button>
      </div>
      <button id="gpsMapa" aria-pressed="false"><i class="fas fa-location-arrow" aria-hidden="true"></i> <span>Minha localização</span></button><p id="posicaoMapa" role="status"></p>
      <nav><a href="central.html"><i class="fas fa-users" aria-hidden="true"></i> Comunidade</a><a href="react.html"><i class="fas fa-plus" aria-hidden="true"></i> Novo post</a></nav>
    </aside>
    <section class="floating-posts-container" aria-label="Postagens da comunidade">
      <div id="listaMapa"></div><p id="avisoMapa" role="status">Carregando postagens…</p><button id="atualizar" hidden>Tentar novamente</button>
    </section>
    <script src="header.js"></script><script src="localizacao.js"></script><script src="comunidade.js"></script><script src="script.js"></script><script src="enderecos.js"></script><script src="rotas.js"></script><script src="gps-mapa.js"></script><script src="mapa-posts.js"></script>
</body></html>
