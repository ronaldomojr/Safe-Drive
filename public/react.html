<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novo post | Safe Drive</title>
  <link rel="icon" href="favicon.ico/favicon.ico">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css"><script src="vendor/leaflet/leaflet.js"></script>
  <link rel="stylesheet" href="comunidade.css">
</head>
<body>
<header class="site-header"><div class="site-header-inner">
  <a class="site-logo" href="p_safedrive.html"><img src="Imagens/image-removebg-preview (1).png" alt="">Safe Drive</a>
  <button class="site-nav-toggle" aria-label="Abrir menu" aria-expanded="false"><span></span><span></span><span></span></button>
  <nav class="site-nav"><a href="mapa.html">Mapa ao vivo</a><a href="central.html">Comunidade</a><a class="site-nav-btn" href="index.html">Entrar</a></nav>
</div></header>
<main class="shell">
  <a href="central.html">← Comunidade</a><h1>Nova ocorrência</h1>
  <p id="login" hidden><a href="index.html">Entre na sua conta para publicar.</a></p>
  <form id="composer"><fieldset id="fields">
    <label>Tipo de ocorrência<select name="categoria"><option>Batida</option><option>Obra</option><option>Trânsito</option><option>Interdição</option><option>Outro</option></select></label>
    <label>Título<input name="titulo" maxlength="150" required placeholder="O que aconteceu?"></label>
    <label>Relato<textarea name="descricao" maxlength="5000" required rows="3" placeholder="Conte o que outros motoristas precisam saber"></textarea></label>
    <label>Foto (opcional)<input name="imagem" type="file" accept="image/jpeg,image/png,image/webp"></label>
    <img id="preview" hidden alt="Prévia da foto selecionada">
    <div class="section-heading"><h2>Local da ocorrência</h2><button type="button" id="gps">Usar minha localização</button></div>
    <p>Toque no mapa ou mova-o e marque o centro.</p><div id="picker" aria-label="Selecionar localização"></div>
    <button type="button" id="confirmarGps" hidden>Confirmar ponto do GPS</button>
    <button type="button" id="center">Marcar o centro do mapa</button><output id="point" aria-live="polite">Selecione um ponto.</output>
    <label>Referência (opcional)<input name="referencia" maxlength="200" placeholder="Rua, bairro ou ponto de referência"></label>
    <button class="primary" id="publish">Publicar ocorrência</button>
  </fieldset></form><p id="status" role="status"></p>
</main>
<script src="header.js"></script><script src="comunidade.js"></script><script src="foto.js"></script><script src="localizacao.js"></script><script src="publicar.js"></script>
</body></html>
